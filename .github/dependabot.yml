# ArrowMacros is registered in General, so Dependabot covers both the GitHub
# Actions versions and the Julia [compat] bounds. It replaces CompatHelper.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: julia
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: Test
